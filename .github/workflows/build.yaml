name: Build & Release AshlynnTGDL

# ─── Triggers ──────────────────────────────────────────────────────────────────
# • Push to main       → build all platforms + publish & mark as Latest release
# • Version tags (v*) → build all platforms + publish versioned Latest release
# • Manual trigger    → allow triggering from GitHub Actions tab
# • PRs                → build check only (no release)
on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to create/update releases
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Build binaries on Windows, Linux, macOS
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: AshlynnTGDL-Windows.exe
            built_path: AshlynnTGDL.exe
          - os: ubuntu-latest
            artifact_name: AshlynnTGDL-Linux
            built_path: AshlynnTGDL
          - os: macos-latest
            artifact_name: AshlynnTGDL-macOS
            built_path: AshlynnTGDL

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies & build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 📦 Install dependencies & build (Windows)
        if: runner.os == 'Windows'
        run: cmd /c build.bat

      # Rename output to platform-specific filename
      - name: 🏷️ Rename binary to platform name
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv AshlynnTGDL.exe "${{ matrix.artifact_name }}"
          else
            mv AshlynnTGDL "${{ matrix.artifact_name }}"
          fi

      - name: 🚀 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Publish & Attach binaries to GitHub Releases
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Publish to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: ⬇️ Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: 📋 List downloaded binary files
        run: ls -lh dist/

      # ── Rolling release (push to main or workflow_dispatch) ────────────────
      - name: 🔄 Publish latest release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest
          name: "AshlynnTGDL — Latest Build"
          body: |
            🚀 **Latest Automated Release Build**

            | File | Platform |
            |------|----------|
            | `AshlynnTGDL-Windows.exe` | 🪟 Windows |
            | `AshlynnTGDL-Linux` | 🐧 Linux |
            | `AshlynnTGDL-macOS` | 🍎 macOS |

            > Built automatically from commit `${{ github.sha }}`
          prerelease: false
          make_latest: true
          files: |
            dist/AshlynnTGDL-Windows.exe
            dist/AshlynnTGDL-Linux
            dist/AshlynnTGDL-macOS

      # ── Versioned release (on tags like v2.0.1) ────────────────────────────
      - name: 🏷️ Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "AshlynnTGDL ${{ github.ref_name }}"
          body: |
            ## AshlynnTGDL ${{ github.ref_name }}

            Download the official executable for your platform below.

            | File | Platform |
            |------|----------|
            | `AshlynnTGDL-Windows.exe` | 🪟 Windows |
            | `AshlynnTGDL-Linux` | 🐧 Linux |
            | `AshlynnTGDL-macOS` | 🍎 macOS |
          prerelease: false
          make_latest: true
          files: |
            dist/AshlynnTGDL-Windows.exe
            dist/AshlynnTGDL-Linux
            dist/AshlynnTGDL-macOS
